<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Morgan Gu — Work</title>

<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Newsreader:opsz,wght@6..72,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ECEDE8; --ink:#1A1F2B; --muted:#5C6470; --rule:#C6C9C0;
  --frame:#D9DBD4; --accent:#2B48C9; --on-accent:#fff;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#16191F; --ink:#E7E8E3; --muted:#9AA1AC; --rule:#2E333C;
    --frame:#23272F; --accent:#93A6FF; --on-accent:#10131A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#16191F; --ink:#E7E8E3; --muted:#9AA1AC; --rule:#2E333C;
  --frame:#23272F; --accent:#93A6FF; --on-accent:#10131A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:.18em}
a:focus-visible,button:focus-visible,video:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
img,video{max-width:100%}

.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(1.1rem,4vw,2.5rem)}

/* Masthead */
header.mast{padding:clamp(2.5rem,8vw,6rem) 0 clamp(2rem,5vw,3.5rem);border-bottom:1px solid var(--rule)}
.name{font-family:"Newsreader",Georgia,"Times New Roman",serif;font-optical-sizing:auto;font-weight:500;font-size:clamp(3.4rem,12vw,9rem);line-height:.9;letter-spacing:-.025em;margin:0}
.mast-row{display:flex;flex-wrap:wrap;gap:1rem 3rem;justify-content:space-between;align-items:flex-end;margin-top:1.5rem}
.role{font-family:var(--body);font-style:italic;font-size:clamp(1.15rem,2.4vw,1.5rem);margin:0}
.contact{font-family:var(--display);font-stretch:85%;font-size:.95rem;display:flex;flex-wrap:wrap;gap:.4rem 1.4rem}
.contact a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule)}
.contact a:hover{border-color:var(--ink)}

/* Sections */
section.group{padding:clamp(2.5rem,6vw,4.5rem) 0 0}
.group-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:1rem;border-bottom:2px solid var(--ink);padding-bottom:.5rem;margin-bottom:1.75rem}
.group-head h2{font-family:var(--display);font-stretch:75%;font-weight:700;font-size:clamp(1.6rem,3.6vw,2.4rem);line-height:1.05;margin:0}
.group-head p{margin:0;color:var(--muted);font-size:.95rem;font-style:italic}

/* Pieces */
.grid{display:grid;gap:2.5rem 2rem}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr))}
.grid.tall{grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:2.5rem 1.75rem}
.piece{margin:0;min-width:0}
.screen{position:relative;background:var(--frame);border-radius:3px;overflow:hidden}
.wide .screen{aspect-ratio:16/9}
.tall .screen{aspect-ratio:9/16;max-height:78vh;border-radius:14px}
.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:block}
.pending{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:1.1rem;gap:.35rem}
.pending span{font-family:var(--display);font-stretch:85%;font-size:.85rem;color:var(--muted)}
.pending a{font-family:var(--display);font-stretch:85%;font-size:.9rem}
figcaption{padding-top:.85rem}
.outlet{font-family:var(--display);font-stretch:85%;font-size:.85rem;color:var(--muted);margin:0 0 .2rem}
.title{font-family:var(--display);font-stretch:85%;font-weight:650;font-size:1.25rem;line-height:1.2;margin:0}
.tall .title{font-size:1.05rem;font-stretch:68%;line-height:1.25}
.desc{margin:.4rem 0 0;color:var(--muted);font-size:.98rem;max-width:62ch}
.orig{display:inline-block;margin-top:.45rem;font-family:var(--display);font-stretch:85%;font-size:.85rem}

/* Series */
.series-desc{margin:-.75rem 0 1.75rem;max-width:62ch}
.series-desc strong{font-weight:600}

/* Credit + writing */
.credit{display:grid;grid-template-columns:clamp(150px,24vw,260px) minmax(0,1fr) auto;gap:1rem 2rem;align-items:start;padding:.25rem 0 0}
.credit h3{margin-top:-.08em !important}
.credit img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:3px;background:var(--frame)}
.credit h3{font-family:var(--display);font-stretch:70%;font-weight:750;font-size:clamp(2.2rem,6vw,3.6rem);line-height:1;margin:0}
.credit p{margin:.5rem 0 0;color:var(--muted)}
.credit .who{font-family:var(--display);font-stretch:85%;font-size:1rem;text-align:right}
.writing{display:block;text-decoration:none;color:var(--ink);padding:.25rem 0 0}
.writing h3{font-family:var(--body);font-weight:600;font-size:clamp(1.4rem,3vw,2rem);line-height:1.2;margin:0;max-width:34ch}
.writing:hover h3{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.15em}
.writing p{margin:.5rem 0 0;color:var(--muted)}


/* Multi-part player */
.sp video{opacity:0;pointer-events:none}
.sp video.on{opacity:1;pointer-events:auto}
.sp-bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:.6rem;padding:.55rem .75rem;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;font-family:var(--display);font-stretch:85%;font-size:.85rem;transition:opacity .2s}
.sp.playing:not(:hover):not(:focus-within) .sp-bar{opacity:0}
.sp-bar button{appearance:none;border:0;background:none;color:#fff;cursor:pointer;padding:.25rem;display:grid;place-items:center;border-radius:3px}
.sp-bar svg{width:20px;height:20px;fill:currentColor}
.sp-bar input[type=range]{flex:1;min-width:0;accent-color:#fff;height:1.2rem;cursor:pointer}
.sp-time{font-variant-numeric:tabular-nums;white-space:nowrap}
.sp-big{position:absolute;inset:0;margin:auto;width:72px;height:72px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;cursor:pointer}
.sp-big svg{width:30px;height:30px;fill:currentColor;margin-left:4px}
.sp.started .sp-big{display:none}
.sp:fullscreen{border-radius:0;aspect-ratio:auto}
@media (prefers-reduced-motion:reduce){.sp-bar{transition:none}}

footer{margin-top:clamp(4rem,9vw,7rem);border-top:1px solid var(--rule);padding:1.5rem 0 2.5rem;font-family:var(--display);font-stretch:85%;font-size:.9rem;color:var(--muted);display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5rem 2rem}
footer a{color:var(--muted)}

@media (max-width:560px){
  header.mast{padding:2.25rem 0 1.75rem}
  .mast-row{margin-top:1rem;gap:.75rem}
  .contact{flex-direction:column;gap:.5rem}
  .contact a{padding:.15rem 0}
  section.group{padding-top:2.75rem}
  .group-head{grid-template-columns:1fr;gap:.15rem;margin-bottom:1.25rem}
  .grid.wide{gap:2.25rem}
  .credit{grid-template-columns:1fr}
  .credit img{max-width:220px}
  .credit .who{text-align:left}
  /* Verticals become a swipeable row; the next video peeks in from the right */
  .grid.tall{display:flex;gap:.9rem;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
    margin-inline:calc(-1 * clamp(1.1rem,4vw,2.5rem));padding-inline:clamp(1.1rem,4vw,2.5rem);scroll-padding-inline:clamp(1.1rem,4vw,2.5rem);scrollbar-width:none}
  .grid.tall::-webkit-scrollbar{display:none}
  .tall .piece{flex:0 0 74%;scroll-snap-align:start}
  .tall .screen{max-height:none}
  /* Bigger tap targets on the player */
  .sp-bar{gap:.35rem;padding:.4rem .5rem}
  .sp-bar button{padding:.55rem}
  .sp-bar svg{width:22px;height:22px}
  .sp-time{font-size:.78rem}
  .orig{padding:.35rem 0}
}
</style>
</head>

function el(tag, cls, text){ const n=document.createElement(tag); if(cls) n.className=cls; if(text!=null) n.textContent=text; return n; }
function host(u){ try{ return new URL(u).hostname.replace(/^www\./,""); }catch(e){ return "original"; } }


const ICON={play:'<svg viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z"/></svg>',pause:'<svg viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>',
 vol:'<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4.5v15L8 15H4zM16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M4 9h4l5-4.5v15L8 15H4z"/></svg>',
 mute:'<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4.5v15L8 15H4z"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="1.8"/></svg>',
 fs:'<svg viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3zM15 4h5v5h-2V6h-3zM20 15v5h-5v-2h3v-3zM9 20H4v-5h2v3h3z"/></svg>'};
function fmt(t){t=Math.max(0,Math.floor(t));const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=String(t%60).padStart(2,"0");return h?h+":"+String(m).padStart(2,"0")+":"+s:m+":"+s;}

/* Plays a piece stored as several consecutive files as one continuous video. */
function partsPlayer(screen, parts, title, poster){
  screen.classList.add("sp");
  const offs=[];let total=0;parts.forEach(p=>{offs.push(total);total+=p.dur;});
  const vids=[0,1].map(()=>{const v=document.createElement("video");v.playsInline=true;v.preload="metadata";v.setAttribute("aria-label",title);screen.appendChild(v);return v;});
  let cur=0, a=vids[0], b=vids[1], playing=false, queued=-1, muted=false;
  a.src=parts[0].src; a.classList.add("on");
  if(poster){ a.poster=poster; }
  const big=el("button","sp-big"); big.innerHTML=ICON.play; big.setAttribute("aria-label","Play "+title);
  const bar=el("div","sp-bar");
  const pp=el("button"); pp.innerHTML=ICON.play; pp.setAttribute("aria-label","Play");
  const range=document.createElement("input"); range.type="range"; range.min=0; range.max=total; range.step=0.1; range.value=0; range.setAttribute("aria-label","Seek");
  const time=el("span","sp-time",fmt(0)+" / "+fmt(total));
  const mu=el("button"); mu.innerHTML=ICON.vol; mu.setAttribute("aria-label","Mute");
  const fs=el("button"); fs.innerHTML=ICON.fs; fs.setAttribute("aria-label","Full screen");
  bar.append(pp,range,time,mu,fs); screen.append(big,bar);
  let dragging=false;
  const now=()=>offs[cur]+(a.currentTime||0);
  function ui(){pp.innerHTML=playing?ICON.pause:ICON.play;pp.setAttribute("aria-label",playing?"Pause":"Play");screen.classList.toggle("playing",playing);
    if(!dragging){range.value=now();} time.textContent=fmt(dragging?+range.value:now())+" / "+fmt(total);}
  function queue(i){ if(i>=parts.length||queued===i) return; queued=i; b.preload="auto"; b.src=parts[i].src; b.load(); }
  function bind(v){
    v.addEventListener("timeupdate",()=>{ if(v!==a) return; ui(); if(v.duration && v.duration-v.currentTime<10) queue(cur+1); });
    v.addEventListener("ended",()=>{ if(v!==a) return; if(cur+1<parts.length){ go(cur+1,0,true); } else { playing=false; ui(); } });
    v.addEventListener("waiting",()=>screen.setAttribute("aria-busy","true"));
    v.addEventListener("playing",()=>screen.removeAttribute("aria-busy"));
  }
  vids.forEach(bind);
  function go(i,t,autoplay){
    if(i!==cur){
      /* In iPhone native full screen, keep the same element so playback stays full screen */
      if(a.webkitDisplayingFullscreen){ a.src=parts[i].src; if(queued===i){ b.removeAttribute("src"); b.load(); } }
      else if(queued===i){ [a,b]=[b,a]; } else { a.src=parts[i].src; }
      queued=-1; cur=i;
      vids.forEach(v=>{v.classList.toggle("on",v===a); if(v!==a) v.pause();});
    }
    const apply=()=>{ try{a.currentTime=t;}catch(e){} if(autoplay) a.play().catch(()=>{playing=false;ui();}); ui(); };
    a.muted=muted;
    if(a.readyState>=1) apply(); else a.addEventListener("loadedmetadata",apply,{once:true});
  }
  function seek(g){ let i=parts.length-1; while(i>0&&g<offs[i]) i--; go(i,Math.min(g-offs[i],parts[i].dur-0.05),playing); }
  function toggle(){ screen.classList.add("started"); if(playing){playing=false;a.pause();} else {playing=true;a.play().catch(()=>{playing=false;ui();});} ui(); }
  big.onclick=toggle; pp.onclick=toggle;
  a.addEventListener("click",toggle); b.addEventListener("click",toggle);
  range.addEventListener("input",()=>{dragging=true;ui();});
  range.addEventListener("change",()=>{dragging=false;seek(+range.value);});
  mu.onclick=()=>{muted=!muted;vids.forEach(v=>v.muted=muted);mu.innerHTML=muted?ICON.mute:ICON.vol;mu.setAttribute("aria-label",muted?"Unmute":"Mute");};
  fs.onclick=()=>{ if(document.fullscreenElement) document.exitFullscreen(); else if(screen.requestFullscreen) screen.requestFullscreen().catch(()=>{}); else if(a.webkitEnterFullscreen) a.webkitEnterFullscreen(); };
  screen.addEventListener("keydown",e=>{ if(e.target===range||e.target.tagName==="BUTTON") return; if(e.key===" "||e.key==="k"){e.preventDefault();toggle();} else if(e.key==="ArrowRight"){seek(Math.min(total,now()+10));} else if(e.key==="ArrowLeft"){seek(Math.max(0,now()-10));} });
  ui();
}

function piece(it){
  const fig = el("figure","piece");
  const screen = el("div","screen");
  if(Array.isArray(it.src)){
    partsPlayer(screen, it.src, it.title, it.poster);
  } else if(it.src){
    const v = document.createElement("video");
    v.src = it.src; v.controls = true; v.preload = "metadata"; v.playsInline = true;
    if(it.poster) v.poster = it.poster;
    v.setAttribute("aria-label", it.title);
    screen.appendChild(v);
  } else {
    const p = el("div","pending");
    p.appendChild(el("span",null,"Video file not added yet"));
    const a = el("a",null,"Watch on " + host(it.url)); a.href = it.url; a.target="_blank"; a.rel="noopener";
    p.appendChild(a);
    screen.appendChild(p);
  }
  fig.appendChild(screen);
  const cap = el("figcaption");
  if(it.outlet) cap.appendChild(el("p","outlet",it.outlet));
  cap.appendChild(el("h3","title",it.title));
  if(it.desc) cap.appendChild(el("p","desc",it.desc));
  if(it.src && it.url){ const a=el("a","orig","Original on " + host(it.url)); a.href=it.url; a.target="_blank"; a.rel="noopener"; cap.appendChild(a); }
  fig.appendChild(cap);
  return fig;
}

const main = document.getElementById("work");
WORK.forEach(g=>{
  const s = el("section","group");
  const head = el("div","group-head");
  head.appendChild(el("h2",null,g.heading));
  if(g.note) head.appendChild(el("p",null,g.note));
  s.appendChild(head);
  if(g.lede){ const p=el("p","series-desc"); if(g.ledeTitle){ p.appendChild(el("strong",null,g.ledeTitle)); p.appendChild(document.createTextNode(" ")); } p.appendChild(document.createTextNode(g.lede)); s.appendChild(p); }

  if(g.kind==="credit"){
    g.items.forEach(it=>{
      const c = el("div","credit");
      if(it.poster){ const im=document.createElement("img"); im.src=it.poster; im.alt=it.title+" poster"; c.appendChild(im); }
      const left = el("div");
      left.appendChild(el("h3",null,it.title));
      left.appendChild(el("p",null,it.year + ", " + it.note));
      c.appendChild(left);
      c.appendChild(el("div","who",it.role));
      s.appendChild(c);
    });
  } else if(g.kind==="writing"){
    g.items.forEach(it=>{
      const a = el("a","writing"); a.href=it.url; a.target="_blank"; a.rel="noopener";
      a.appendChild(el("h3",null,it.title));
      a.appendChild(el("p",null,it.outlet));
      s.appendChild(a);
    });
  } else {
    const grid = el("div","grid " + g.kind);
    g.items.forEach(it=>grid.appendChild(piece(it)));
    s.appendChild(grid);
  }
  main.appendChild(s);
});
</script>
</body>
</html>
