<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Untitled</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --stage-w:1920px;
  --stage-h:1080px;
  --white:#f2f2f0;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --display:"Archivo","Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:#000;color:var(--white);
  overflow:hidden;font-family:var(--mono);
  display:grid;place-items:center;
}

/* ---- FIXED 1920x1080 STAGE, scaled to fit any viewport ---- */
#stage{
  position:relative;
  width:var(--stage-w);height:var(--stage-h);
  flex:none;overflow:hidden;background:#000;
  transform:scale(var(--s,1));
  transform-origin:center center;
}
#bg{
  position:absolute;inset:0;
  width:1920px;height:1080px;
  object-fit:cover;
}

/* vignette keeps the corners readable when the footage blows out white */
.vignette{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 45%,transparent 38%,rgba(0,0,0,.42) 100%);
}
.grain{
  position:absolute;inset:0;pointer-events:none;opacity:.14;mix-blend-mode:overlay;
}

/* ---- TYPE LAYER ---- */
.plate{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between}
.row{display:flex;justify-content:space-between;align-items:flex-end;gap:2rem}

.eyebrow{
  font-size:13px;letter-spacing:.34em;text-transform:uppercase;
  margin:0;opacity:.72;
}

/* The signature move: difference blending. The footage swings from near-black
   to blown-out white, so the wordmark inverts itself to stay legible. */
.wordmark{
  margin:0;
  font-family:var(--display);
  font-variation-settings:"wdth" 118,"wght" 600;
  font-size:190px;line-height:.84;letter-spacing:-.035em;
  text-transform:uppercase;
  color:#fff;mix-blend-mode:difference;
  max-width:15ch;
}
.standfirst{
  font-size:15px;line-height:1.7;max-width:42ch;margin:28px 0 0;
  opacity:.8;letter-spacing:.02em;
}

/* ---- CONTROLS ---- */
.controls{display:flex;align-items:center;gap:20px}
button{
  font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  background:none;border:1px solid rgba(242,242,240,.32);color:var(--white);
  padding:14px 22px;cursor:pointer;
  transition:background .25s,border-color .25s;
}
button:hover{background:rgba(242,242,240,.12);border-color:var(--white)}
button:focus-visible{outline:2px solid var(--white);outline-offset:3px}

.enter{
  display:inline-flex;align-items:center;gap:12px;
  font-size:12px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--white);text-decoration:none;opacity:.85;
}
.enter .arrow{display:inline-block;animation:drift 2.6s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}

/* hairline at the base fills with the video's own loop position */
.loopbar{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(242,242,240,.16)}
.loopbar i{display:block;height:100%;width:0;background:var(--white)}

@media (prefers-reduced-motion:reduce){
  .enter .arrow{animation:none}
}
</style>
</head>
<body>

<div id="stage">
  <video id="bg" src="entry.mp4" autoplay muted loop playsinline aria-hidden="true"></video>
  <div class="vignette"></div>
  <svg class="grain" aria-hidden="true"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>

  <div class="plate">
    <div class="row">
      <p class="eyebrow">Ackerley Creative</p>
      <p class="eyebrow">2026 — 00:53 loop</p>
    </div>

    <div>
      <h1 class="wordmark">Untitled</h1>
      <p class="standfirst">Replace this line with the one sentence that tells someone what they are about to watch. Keep it to a breath — the footage is already doing the arguing.</p>
    </div>

    <div class="row">
      <div class="controls">
        <button id="sound" aria-pressed="false">♪ Sound off</button>
      </div>
      <a class="enter" href="#chapters">Enter the story <span class="arrow">↓</span></a>
    </div>
  </div>

  <div class="loopbar"><i id="loopfill"></i></div>
</div>

<script>
/* Scale the 1920x1080 stage to fit the window without ever reflowing it. */
const stage = document.getElementById('stage');
function fit(){
  const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  stage.style.setProperty('--s', s);
}
window.addEventListener('resize', fit);
fit();

const bg = document.getElementById('bg');

/* Sound toggle — browsers only allow audio after a real click. */
const sound = document.getElementById('sound');
sound.addEventListener('click', () => {
  bg.muted = !bg.muted;
  sound.setAttribute('aria-pressed', String(!bg.muted));
  sound.textContent = bg.muted ? '♪ Sound off' : '♪ Sound on';
  if (!bg.muted) bg.play();
});

/* Hairline tracks where the loop is. */
const fill = document.getElementById('loopfill');
bg.addEventListener('timeupdate', () => {
  if (bg.duration) fill.style.width = (bg.currentTime / bg.duration) * 100 + '%';
});

/* Honour reduced-motion: hold on the first frame instead of looping. */
if (window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  bg.removeAttribute('autoplay');
  bg.pause();
}
</script>
</body>
</html>
